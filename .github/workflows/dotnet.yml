name: CI/CD for CalculatorApp

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore and build main project
      run: |
        cd CalculatorApp
        dotnet restore
        dotnet build --no-restore

    - name: Restore and build tests
      run: |
        cd CalculatorApp.Tests
        dotnet restore
        dotnet build --no-restore

    - name: Run tests
      run: cd CalculatorApp.Tests && dotnet test --no-build --verbosity normal
